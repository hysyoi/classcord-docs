<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Classcord — 技術文件</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Classcord 後端架構與壓力測試技術文件">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" title="light">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css" title="dark" disabled>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.css">
  <style>
    :root {
      --theme-color: #0f9488;
      --code-theme-background: #f7f8f7;
    }
    body, .markdown-section {
      font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4,
    .sidebar-nav a {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    .markdown-section h1 { font-size: 30px; }
    .markdown-section h2 {
      font-size: 22px;
      border-bottom: 1px solid rgba(0,0,0,.08);
      padding-bottom: 8px;
      margin-top: 48px;
    }
    .markdown-section code {
      font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
    .markdown-section table th, .markdown-section table td {
      font-size: 14.5px;
    }
    .app-name-link img { display: none; }
    .sidebar-nav > ul > li > a { font-weight: 600; }

    /* Dark theme toggle button */
    #theme-toggle {
      position: fixed;
      top: 14px;
      right: 20px;
      z-index: 20;
      background: var(--theme-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (max-width: 768px) {
      #theme-toggle { top: 8px; right: 8px; padding: 5px 9px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <button id="theme-toggle" onclick="toggleTheme()">深色模式</button>
  <div id="app"></div>
  <script>
    function toggleTheme() {
      var light = document.querySelector('link[title="light"]');
      var dark = document.querySelector('link[title="dark"]');
      var btn = document.getElementById('theme-toggle');
      var isDark = !dark.disabled;
      dark.disabled = isDark;
      light.disabled = !isDark;
      btn.textContent = isDark ? '深色模式' : '淺色模式';
      localStorage.setItem('classcord-docs-theme', isDark ? 'light' : 'dark');
    }
    (function () {
      var saved = localStorage.getItem('classcord-docs-theme');
      if (saved === 'dark') {
        document.addEventListener('DOMContentLoaded', function () {
          document.querySelector('link[title="light"]').disabled = true;
          document.querySelector('link[title="dark"]').disabled = false;
          document.getElementById('theme-toggle').textContent = '淺色模式';
        });
      }
    })();

    // GitHub 相容的標題錨點（github-slugger 演算法）：轉小寫、移除非「文字/數字/組合符號/空白/連字號/底線」的字元、空白轉連字號。
    // 讓內文既有的 GitHub 風格錨點連結（例如 #00--亮點摘要）在 Docsify 底下也能正確跳轉。
    function githubSlug(text) {
      return text.toString().trim().toLowerCase()
        .replace(/<[^>]*>/g, '')
        .replace(/[^\p{L}\p{N}\p{M}\- _]/gu, '')
        .replace(/ /g, '-');
    }

    // Docsify 內建的捲動至錨點邏輯是用 document.querySelector('#' + id)，
    // 但 CSS ID 選擇器不允許以數字開頭又未跳脫，我們的錨點（例如 06--服務深入gateway）
    // 剛好都是數字開頭，會直接拋出例外導致捲動失敗。改用 getElementById 自行處理。
    function scrollToHashAnchor() {
      var match = /\?id=([^&]+)/.exec(window.location.hash);
      if (!match) return;
      var id = decodeURIComponent(match[1]);
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ block: 'start' });
    }
    function anchorScrollFix(hook) {
      // doneEach 涵蓋站內點擊切換頁面／錨點的情況
      hook.doneEach(function () {
        setTimeout(scrollToHashAnchor, 0);
      });
      // 首次載入（例如直接開啟帶錨點的網址）時，Docsify 內建邏輯會先拋出例外，
      // 導致 doneEach 來不及帶著正確捲動位置執行，額外用 mounted 補一次。
      hook.mounted(function () {
        setTimeout(scrollToHashAnchor, 300);
      });
    }

    // docsify-mermaid@2 外掛跟新版 Mermaid 的非同步 API 對不上，直接自行呼叫 mermaid.init()
    // 把頁面裡 class="mermaid" 的區塊（Docsify 用 markdown 的 ```mermaid``` 區塊自動產生）畫成圖表。
    function renderMermaidNodes() {
      if (!window.mermaid) return;
      var nodes = document.querySelectorAll('.mermaid:not([data-processed="true"])');
      if (nodes.length) window.mermaid.init(undefined, nodes);
    }
    function mermaidRenderFix(hook) {
      hook.doneEach(function () {
        setTimeout(renderMermaidNodes, 50);
      });
      // 同上：首次載入時 doneEach 可能被 Docsify 內建例外打斷，額外補一次。
      hook.mounted(function () {
        setTimeout(renderMermaidNodes, 350);
      });
    }

    // 保險機制：不論上面兩個 hook 有沒有準時觸發，都用兩個獨立的瀏覽器原生事件再補跑一次：
    // - load：涵蓋「直接開啟帶錨點的網址」這種冷啟動情況（doneEach/mounted 常來不及）。
    // - hashchange：涵蓋「App 已經在跑，但換了一個 route」的情況（例如側邊欄從首頁點進 README
    //   某個章節，這是「換頁」不是「同頁跳段落」，會走到 Docsify 內建、會拋例外的那段邏輯，
    //   doneEach 常常因此來不及帶著正確結果執行）。兩者都做同樣的事：晚一點再強制修正一次。
    function fixAfterNavigation() {
      setTimeout(function () {
        scrollToHashAnchor();
        renderMermaidNodes();
      }, 400);
    }
    window.addEventListener('load', fixAfterNavigation);
    window.addEventListener('hashchange', fixAfterNavigation);

    window.$docsify = {
      name: 'Classcord 技術文件',
      loadSidebar: true,
      plugins: [anchorScrollFix, mermaidRenderFix],
      markdown: {
        renderer: {
          heading: function (text, level) {
            var slug = githubSlug(text);
            return '<h' + level + ' id="' + slug + '">' + text + '</h' + level + '>';
          }
        }
      },
      subMaxLevel: 0,
      auto2top: true,
      maxLevel: 4,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜尋文件...',
        noData: '找不到結果。',
        depth: 4
      },
      copyCode: {
        buttonText: '複製',
        errorText: '錯誤',
        successText: '已複製'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true
      },
      mermaidConfig: {
        theme: 'default'
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js"></script>
</body>
</html>
